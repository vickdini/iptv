# Builds every download on GitHub's machines and publishes them together.
#
# * Push a tag like `v0.2.0` (matching the version in Cargo.toml) to create a
#   GitHub Release with IPTV-Setup-<version>.exe (Windows),
#   IPTV-<version>-x86_64.AppImage (Linux), IPTV-<version>-macOS-arm64.dmg and
#   -x86_64.dmg (Macs), IPTV-<version>.apk (Android), the Samsung TV zip and
#   SHA256SUMS.txt.
# * "Run workflow" from the Actions tab builds both without releasing them
#   (download them from the run's artifacts) - handy for testing.
#
# The APK is signed with the key stored in the repository secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned mpv build bundled in the installer (shinchiro's Windows builds,
  # https://github.com/shinchiro/mpv-winbuild-cmake/releases). To update:
  # pick a newer mpv-x86_64-*.7z asset, then set its URL and SHA-256 here.
  MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261109/mpv-x86_64-20261109-git-8bc468896e.7z
  MPV_SHA256: 7e9588d62c5b830ac2413a3a475b5588e445406e0466dd6333477e631237ec4a
  ANDROID_NDK_VERSION: 27.0.12077973
  # Official mpv builds for Macs (https://github.com/mpv-player/mpv/releases),
  # bundled in the .dmg files. To update: set newer URLs and their SHA-256.
  MPV_MAC_ARM_URL: https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-macos-15-arm.zip
  MPV_MAC_ARM_SHA256: be1b8d2445e6880860869c080b8710dee189721f1fa4689840db6a2c10d7be69
  MPV_MAC_INTEL_URL: https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-macos-15-intel.zip
  MPV_MAC_INTEL_SHA256: 2d2f34350ff844b6014c35f21ca142937275e19c0c673150a8564fcd2f3bfa14

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read version and check it matches the tag
        run: |
          version=$(grep -m1 -E '^\s*version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version (add '## [$version] - date')"
            exit 1
          fi

  windows-installer:
    needs: version
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Download mpv
        shell: pwsh
        run: |
          Invoke-WebRequest $env:MPV_URL -OutFile mpv.7z
          $hash = (Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_SHA256) { throw "mpv download checksum mismatch: $hash" }
          7z x mpv.7z -ompv-bundle -y | Out-Null
          ./mpv-bundle/mpv.exe --version | Select-Object -First 1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -MpvDir "$PWD\mpv-bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/installer/IPTV-Setup-*.exe

  linux-appimage:
    needs: version
    timeout-minutes: 45
    # The oldest supported system: the AppImage runs on Linux with glibc 2.35
    # or newer (Ubuntu 22.04, Debian 12, Fedora 36 and later).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # mpv comes from Ubuntu's package servers, which GitHub's machines
      # sometimes can't reach. Downloaded packages are kept in GitHub's own
      # build cache (per runner image), so later builds don't need them.
      - name: Runner image version
        id: image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Ubuntu packages from the build cache
        uses: actions/cache@v4
        with:
          path: ~/debs
          key: debs-ubuntu-22.04-${{ steps.image.outputs.version }}-mpv-v1

      - name: Install mpv and packaging tools
        timeout-minutes: 15
        run: |
          # 1. From the cache, without contacting any server. (dpkg rather than
          #    apt: apt wants its package lists for a set of local files.) The
          #    cached install counts if mpv runs; otherwise download as usual.
          if ls ~/debs/*.deb > /dev/null 2>&1; then
            sudo dpkg -i --skip-same-version ~/debs/*.deb > "$RUNNER_TEMP/dpkg.log" 2>&1 ||
              sudo dpkg --configure -a >> "$RUNNER_TEMP/dpkg.log" 2>&1 || true
            if mpv --version > /dev/null 2>&1 && command -v desktop-file-validate > /dev/null; then
              echo "Installed from the build cache: $(mpv --version | head -1)"
              exit 0
            fi
            echo "::warning::the cached packages didn't install cleanly; downloading them"
          fi
          # 2. From an Ubuntu mirror that actually answers: each candidate must
          #    serve a small index file within 10 s (HTTPS ones first, in case
          #    plain HTTP is what's blocked). Only that mirror is used: the
          #    runner's extra package sources (PPAs, Microsoft) are switched off,
          #    so none of them can stall the download.
          mirror=""
          for m in http://azure.archive.ubuntu.com/ubuntu/ \
                   https://mirrors.edge.kernel.org/ubuntu/ \
                   https://mirror.init7.net/ubuntu/ \
                   https://mirrors.mit.edu/ubuntu/ \
                   https://ftp.halifax.rwth-aachen.de/ubuntu/ \
                   https://mirrors.ocf.berkeley.edu/ubuntu/ \
                   https://mirror.math.princeton.edu/pub/ubuntu/ \
                   http://archive.ubuntu.com/ubuntu/; do
            if curl -fsS -m 10 -o /dev/null "${m}dists/jammy-updates/InRelease"; then
              mirror="$m"
              break
            fi
            echo "::warning::Ubuntu mirror $m didn't answer"
          done
          if [ -z "$mirror" ]; then
            echo "::error::No Ubuntu mirror is reachable from this machine"
            exit 1
          fi
          echo "Using $mirror"
          sudo mv /etc/apt/sources.list.d /etc/apt/sources.list.d.off
          sudo mkdir /etc/apt/sources.list.d
          printf 'deb %s %s main restricted universe multiverse\n' \
            "$mirror" jammy "$mirror" jammy-updates "$mirror" jammy-security | sudo tee /etc/apt/sources.list
          opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get update -qq $opts
          sudo apt-get install -y -qq --download-only $opts mpv file desktop-file-utils
          # Keep the packages for the next builds (the cache is saved when the
          # job succeeds). Copied before installing: apt may delete them after.
          mkdir -p ~/debs
          cp /var/cache/apt/archives/*.deb ~/debs/ 2>/dev/null || true
          echo "Cached $(ls ~/debs | wc -l) packages"
          sudo apt-get install -y -qq $opts mpv file desktop-file-utils

      - name: Run tests
        run: cargo test -p iptv-core -p iptv-net -p iptv-desktop

      - name: Build the AppImage
        run: packaging/linux/build-appimage.sh

      - name: Smoke test
        run: |
          app=$(ls target/appimage/IPTV-*-x86_64.AppImage)
          "$app" --appimage-extract-and-run --version
          target/appimage/AppDir/usr/bin/mpv --version | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/appimage/IPTV-*-x86_64.AppImage

  macos-dmg:
    needs: version
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p iptv-core -p iptv-net -p iptv-desktop

      - name: Download mpv
        run: |
          curl -fsSL "$MPV_MAC_ARM_URL" -o mpv-arm.zip
          curl -fsSL "$MPV_MAC_INTEL_URL" -o mpv-intel.zip
          echo "$MPV_MAC_ARM_SHA256  mpv-arm.zip" | shasum -a 256 -c
          echo "$MPV_MAC_INTEL_SHA256  mpv-intel.zip" | shasum -a 256 -c

      - name: Build the disk images
        run: |
          packaging/macos/build-dmg.sh arm64 mpv-arm.zip
          packaging/macos/build-dmg.sh x86_64 mpv-intel.zip

      - name: Smoke test (Apple silicon)
        run: |
          app=target/macos/arm64/IPTV.app
          "$app/Contents/MacOS/iptv" --version
          "$app/Contents/Resources/mpv.app/Contents/MacOS/mpv" --version | head -1
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" target/macos/IPTV-*-macOS-arm64.dmg
          ls "$RUNNER_TEMP/dmg"
          hdiutil detach "$RUNNER_TEMP/dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/macos/IPTV-*.dmg

  android-apk:
    needs: version
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "platforms;android-35" > /dev/null

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Signing secrets are missing; refusing to release an unsigned APK. See the README."
            exit 1
          else
            echo "::warning::No signing key configured: building an unsigned APK (can't be installed)."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify and name the APK
        run: |
          mkdir -p dist
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          out="dist/IPTV-${{ needs.version.outputs.version }}.apk"
          cp "$src" "$out"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$out" | grep -E "certificate (DN|SHA-256)"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  samsung-tv:
    needs: version
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # TV browsers are old Chromium versions, so the Rust standard library is
      # rebuilt for "MVP" WebAssembly with nightly Rust (see tizen/build.ps1).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen and binaryen
        shell: pwsh
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          $v = "version_133"
          $tgz = "binaryen-$v-x86_64-windows.tar.gz"
          Invoke-WebRequest "https://github.com/WebAssembly/binaryen/releases/download/$v/$tgz" -OutFile $tgz
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.local" | Out-Null
          tar -xzf $tgz -C "$env:USERPROFILE\.local"

      - name: Build the Samsung TV app
        shell: pwsh
        run: ./tizen/build.ps1

      - name: Package for download
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $dir = "dist\IPTV-Samsung-TV-$v"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\tizen\app "$dir\app" -Recurse
          Copy-Item tizen\install-on-tv.ps1 $dir
          Copy-Item LICENSE "$dir\LICENSE.txt"
          Compress-Archive -Path $dir -DestinationPath "dist\IPTV-Samsung-TV-$v.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: samsung-tv
          path: dist/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, windows-installer, linux-appimage, macos-dmg, android-apk, samsung-tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload files
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.version.outputs.version }}"
          # The lines after "## [v]" up to the next version heading.
          awk -v v="$v" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            /^\[[0-9]/ { on = 0 }
            on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum IPTV-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
