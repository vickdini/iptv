# Builds the Windows installer on GitHub's machines and publishes it.
#
# * Push a tag like `v0.2.0` (matching the version in Cargo.toml) to create a
#   GitHub Release with IPTV-Setup-<version>.exe and its SHA-256 checksum.
# * "Run workflow" from the Actions tab builds the installer without
#   releasing it (download it from the run's artifacts) - handy for testing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create releases and upload assets

env:
  # Pinned mpv build bundled in the installer (shinchiro's Windows builds,
  # https://github.com/shinchiro/mpv-winbuild-cmake/releases). To update:
  # pick a newer mpv-x86_64-*.7z asset, then set its URL and SHA-256 here.
  MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261109/mpv-x86_64-20261109-git-8bc468896e.7z
  MPV_SHA256: 7e9588d62c5b830ac2413a3a475b5588e445406e0466dd6333477e631237ec4a

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $m.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Download mpv
        shell: pwsh
        run: |
          Invoke-WebRequest $env:MPV_URL -OutFile mpv.7z
          $hash = (Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_SHA256) { throw "mpv download checksum mismatch: $hash" }
          7z x mpv.7z -ompv-bundle -y | Out-Null
          ./mpv-bundle/mpv.exe --version | Select-Object -First 1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -MpvDir "$PWD\mpv-bundle"

      - name: Write checksum
        shell: pwsh
        run: |
          Get-ChildItem target/installer/IPTV-Setup-*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content target/installer/SHA256SUMS.txt
          Get-Content target/installer/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            target/installer/IPTV-Setup-*.exe
            target/installer/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/installer/IPTV-Setup-*.exe
            target/installer/SHA256SUMS.txt
          generate_release_notes: true
