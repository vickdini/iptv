[package]
name = "iptv-android"
description = "JNI bridge exposing the IPTV core (tuner, playlist, channel checks) to the Android app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "iptv_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
iptv-core = { path = "../iptv-core" }
iptv-net = { path = "../iptv-net" }
iptv-remote = { path = "../iptv-remote" }
anyhow = "1"
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
