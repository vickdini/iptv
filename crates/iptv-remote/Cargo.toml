[package]
name = "iptv-remote"
description = "Phone remote: a small web server on the home network serving a remote-control page"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iptv-core = { path = "../iptv-core" }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
