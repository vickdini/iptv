[package]
name = "iptv-net"
description = "Playlist download/caching and channel health checks shared by IPTV front-ends"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iptv-core = { path = "../iptv-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
url = "2"
quick-xml = { version = "0.38", features = ["serialize"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = "1"
