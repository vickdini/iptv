[package]
name = "iptv-desktop"
description = "Desktop IPTV player (Windows / Linux / macOS) driving mpv"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "iptv"
path = "src/main.rs"

[dependencies]
iptv-core = { path = "../iptv-core" }
iptv-net = { path = "../iptv-net" }
iptv-remote = { path = "../iptv-remote" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
